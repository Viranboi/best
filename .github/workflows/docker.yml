name: Build and Test Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: 0852369147@Viran
          MYSQL_DATABASE: moviesdb
        options: --health-cmd="mysqladmin ping --silent" --health-start-period=5s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Build and run the containers
        run: |
          docker-compose up --build -d

      - name: Run Tests
        run: |
          docker exec -t movie_app npm test

      - name: Shut down Docker containers
        run: |
          docker-compose down
